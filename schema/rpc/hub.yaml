domain: hub
callers: [local, session]
doc: >-
  On a hub: the vaults it serves, the devices paired with it and the URL
  they should use (docs/specs/sync-protocol.md, docs/specs/lodge-app.md).
  Approving a device, serving a vault and recording the URL happen only
  over the local socket (ADR-0016, ADR-0026); a session may list and revoke.
types:
  - name: HubStatus
    doc: This notesd's hub role.
    fields:
      - {name: hub, type: string, doc: "The hub's ID; empty until it serves a vault."}
      - {name: listen, type: string, optional: true, doc: "The address notesd --hub serves; absent without --hub."}
      - {name: url, type: string, optional: true, doc: "The URL devices should use, from hub.setURL; absent until one is recorded."}
      - {name: vaults, type: int}
      - {name: devices, type: int, doc: "Paired devices that are not revoked."}
      - {name: connected, type: int, doc: "Devices connected now."}
  - name: HubVault
    doc: A vault the hub serves.
    fields:
      - {name: vaultId, type: int}
      - {name: sync, type: string, doc: "Its sync ID."}
      - {name: name, type: string}
      - {name: seq, type: int, doc: "Its log's latest sequence number."}
      - {name: servedAt, type: time}
  - name: PendingPairing
    doc: A device waiting to pair.
    fields:
      - {name: code, type: string}
      - {name: name, type: string, doc: "The name the device gave."}
      - {name: addr, type: string, doc: "The address it asked from, as the hub saw it."}
      - {name: createdAt, type: time}
      - {name: expiresAt, type: time}
      - {name: approved, type: bool, doc: "Approved, and not yet collected."}
  - name: HubDevice
    doc: A paired device.
    fields:
      - {name: id, type: int}
      - {name: name, type: string}
      - {name: pairedAt, type: time}
      - {name: seenAt, type: time, optional: true, doc: "Its last request; absent when it never used its token."}
      - {name: connected, type: bool}
      - {name: revoked, type: bool}
methods:
  - name: status
    doc: This notesd's hub role.
    result: HubStatus
  - name: serve
    callers: [local]
    doc: >-
      Serve a registered vault to devices: it gets a sync ID, and each of its
      files a create revision, by path.
    params:
      - {name: vaultId, type: int}
    result: HubVault
    errors: [notFound, conflict]
  - name: vaults
    doc: The vaults this hub serves.
    result: "[]HubVault"
  - name: pending
    doc: Pairings waiting for approval, oldest first.
    result: "[]PendingPairing"
  - name: approve
    callers: [local]
    doc: Approve the pending pairing with this code (case, spaces and '-' ignored).
    params:
      - {name: code, type: string}
    result: PendingPairing
    errors: [notFound]
  - name: devices
    doc: The paired devices, by ID.
    result: "[]HubDevice"
  - name: revoke
    doc: Revoke a device's token and close its connections; its revisions keep its name.
    params:
      - {name: device, type: int}
    errors: [notFound]
  - name: setURL
    callers: [local]
    doc: >-
      Record the URL devices should use: an https:// URL, or http:// on
      loopback, by sync-protocol's rules; empty forgets it. Devices learn it
      with log.hub and move to it, and it is the URL a relocation proof
      names (docs/specs/lodge-app.md#device).
    params:
      - {name: url, type: string}
    result: HubStatus
    errors: [invalidParams]
