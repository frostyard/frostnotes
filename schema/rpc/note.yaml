domain: note
callers: [local]
doc: >-
  The notes and attachments in a vault, and what notesd's index knows of
  them (docs/design/vault.md). A path is vault-relative and slash-separated,
  as on disk. Every write names the hash of the content it started from, as
  note.read returns it (ADR-0006): when the file changed since, notesd
  merges three ways, writes the result and returns it. Only a create has no
  base.
enums:
  - name: LinkKind
    doc: Where a link is written (docs/specs/markdown.md).
    values:
      - {name: wiki, doc: "A [[wikilink]] or ![[embed]] in the body."}
      - {name: markdown, doc: "A markdown link or image to a vault file."}
      - {name: property, doc: "A wikilink in a frontmatter value."}
  - name: FileKind
    doc: What the index makes of a file.
    values:
      - {name: note, doc: "A markdown note (.md), parsed and indexed."}
      - {name: attachment, doc: "Any other file: indexed by name and hash only."}
  - name: VersionSource
    doc: Who made a version.
    values:
      - {name: editor, doc: "A client: the app, the web app or notesctl."}
      - {name: agent, doc: "An agent, through MCP."}
      - {name: outside, doc: "Another program: notesd found the change on disk."}
      - {name: sync, doc: "Another device, through the hub."}
types:
  - name: NoteEntry
    doc: A note in a listing.
    fields:
      - {name: path, type: string}
      - {name: title, type: string, doc: "The file name without .md."}
      - {name: hash, type: string, doc: "The SHA-256 of the content, lowercase hex: the base for the next write."}
      - {name: size, type: int, doc: "In bytes."}
      - {name: modifiedAt, type: time, doc: "The file's modification time."}
      - {name: aliases, type: "[]string", doc: "The note's frontmatter aliases, in order; empty without any."}
  - name: Note
    doc: A note's content and what the index found in it.
    fields:
      - {name: path, type: string}
      - {name: title, type: string, doc: "The file name without .md."}
      - {name: hash, type: string, doc: "The SHA-256 of content, lowercase hex: the base for the next write."}
      - {name: modifiedAt, type: time, doc: "The file's modification time."}
      - {name: content, type: string, doc: "The file's text, byte for byte, except that each sequence of bytes that is not UTF-8 reads as U+FFFD; note.write keeps those bytes where a write leaves them be (ADR-0014)."}
      - {name: props, type: json, doc: "The frontmatter as a JSON object; {} without one or when it is not a YAML mapping."}
      - {name: propError, type: string, optional: true, doc: "Why the frontmatter is not a YAML mapping."}
      - {name: aliases, type: "[]string"}
      - {name: tags, type: "[]string", doc: "Frontmatter and inline tags, each once, as first spelled, without '#'."}
  - name: Link
    doc: A link in a note (docs/specs/markdown.md#parse-output).
    fields:
      - {name: kind, type: LinkKind}
      - {name: target, type: string, doc: "The file named, as written (percent-decoded in a markdown link); empty for the note itself."}
      - {name: subpath, type: string, doc: "A heading or block ID with its '#'; empty when none."}
      - {name: alias, type: string, doc: "The display text; empty when none."}
      - {name: embed, type: bool}
      - {name: key, type: string, doc: "The frontmatter key of a property link; empty otherwise."}
      - {name: line, type: int, doc: "1-based line in the note; a property link's key's line."}
      - {name: resolved, type: string, optional: true, doc: "The path of the file it resolves to; absent when unresolved."}
  - name: Backlink
    doc: A link to a file from a note.
    fields:
      - {name: source, type: string, doc: "The linking note's path."}
      - {name: link, type: Link}
      - {name: context, type: "[]SnippetPart", doc: "The link's line in the source, the link itself marked as matching, cut with '…' about 120 characters from it; empty when the source's text is not at hand."}
  - name: SnippetPart
    doc: A piece of a search snippet.
    fields:
      - {name: text, type: string}
      - {name: match, type: bool, doc: "This text matched the query."}
  - name: SearchHit
    doc: A note that matched a search.
    fields:
      - {name: path, type: string}
      - {name: title, type: string}
      - {name: snippet, type: "[]SnippetPart", doc: "About 16 words around the best match, from the column that matched best; '…' marks cut text."}
  - name: WriteResult
    doc: A note after a write.
    fields:
      - {name: path, type: string}
      - {name: hash, type: string, doc: "The new content's hash: the base for the next write."}
      - {name: merged, type: bool, doc: "The file had changed since the base, and notesd merged the write into it."}
      - {name: content, type: string, optional: true, doc: "What the file now holds, when merged is true."}
      - {name: conflicts, type: int, doc: "Hunks both sides changed differently; the file's newer side of each stands, and the content sent is kept as a conflict version (ADR-0005)."}
      - {name: conflictVersion, type: int, optional: true, doc: "The conflict version's id, when conflicts is above zero: what note.readVersion reads back."}
      - {name: mergedSource, type: VersionSource, optional: true, doc: "When merged is true: who made the version the write was merged into."}
      - {name: mergedAuthor, type: string, optional: true, doc: "When merged is true: that version's author; empty for an outside edit."}
  - name: MoveResult
    doc: A file after a move.
    fields:
      - {name: path, type: string, doc: "The new path."}
      - {name: rewritten, type: "[]string", doc: "The notes whose links to the file were rewritten, by path."}
  - name: Version
    doc: A version of a file, as notesd wrote or scanned it.
    fields:
      - {name: id, type: int}
      - {name: path, type: string, doc: "The file's path when this version was made."}
      - {name: hash, type: string, doc: "The content's hash; empty for a deletion."}
      - {name: size, type: int}
      - {name: at, type: time}
      - {name: source, type: VersionSource}
      - {name: author, type: string, doc: "The writer's name; empty for an outside edit."}
      - {name: deleted, type: bool, doc: "This version records the file's deletion."}
      - {name: conflict, type: bool, doc: "A writer's content that lost a conflicting hunk in a merge: kept so nothing is lost, but never the file's content."}
  - name: DailyNote
    doc: A day's daily note.
    fields:
      - {name: note, type: Note}
      - {name: created, type: bool, doc: "notesd created it from the vault's template for this call."}
  - name: VaultFile
    doc: A file of a vault, as the index has it.
    fields:
      - {name: path, type: string}
      - {name: kind, type: FileKind}
      - {name: hash, type: string, doc: "The SHA-256 of the content, lowercase hex: a write's base, and the name of its bytes for the app (ADR-0023)."}
      - {name: size, type: int, doc: "In bytes."}
      - {name: modifiedAt, type: time, doc: "The file's modification time."}
  - name: VaultFiles
    doc: Every file and folder of a vault.
    fields:
      - {name: files, type: "[]VaultFile", doc: "By path."}
      - {name: folders, type: "[]string", doc: "Every folder below the root, empty ones included, by path; the root is not listed."}
  - name: Resolution
    doc: Where a link target leads from a note.
    fields:
      - {name: target, type: string, doc: "The target as asked, without subpath or alias."}
      - {name: path, type: string, optional: true, doc: "The file it resolves to; absent when unresolved."}
  - name: RenderedNote
    doc: A note rendered for the reading view (docs/design/app.md#reading-view).
    fields:
      - {name: html, type: string, doc: "Sanitized HTML: no script, event handler, form, frame, style or javascript: URL. Vault files appear as data-blob attributes, never as URLs (ADR-0023)."}
  - name: VersionContent
    doc: A version's content.
    fields:
      - {name: version, type: Version}
      - {name: content, type: string, doc: "As note.read gives content: bytes that are not UTF-8 read as U+FFFD (ADR-0014); empty for a deletion."}
  - name: TagCount
    doc: A tag and how many notes have it.
    fields:
      - {name: tag, type: string, doc: "As first spelled, without '#'; nested tags are listed whole (a/b), and their parents only when a note has the parent itself."}
      - {name: count, type: int, doc: "Notes with the tag, ignoring case."}
  - name: PropertyCount
    doc: A frontmatter key and how many notes have it.
    fields:
      - {name: key, type: string, doc: "As first spelled."}
      - {name: type, type: string, doc: "Its type from the vault's property types (text, multitext, number, checkbox, date, datetime, aliases, tags); empty when it has none."}
      - {name: count, type: int, doc: "Notes with the key, ignoring case."}
  - name: ExpandedTemplate
    doc: A template with its variables expanded.
    fields:
      - {name: content, type: string}
  - name: FileBase
    doc: A file and the hash a delete expects it to have.
    fields:
      - {name: path, type: string}
      - {name: base, type: string}
  - name: FolderMoveResult
    doc: A folder after a move.
    fields:
      - {name: path, type: string, doc: "The folder's new path."}
      - {name: moved, type: "[]string", doc: "The files moved, by their new paths."}
      - {name: rewritten, type: "[]string", doc: "The notes whose links were rewritten, by path."}
  - name: FolderDeleteResult
    doc: What a folder delete did.
    fields:
      - {name: deleted, type: "[]string", doc: "The files deleted, by path."}
      - {name: kept, type: "[]string", doc: "Files kept: changed since their base, or not named (made since the listing). An edit beats a delete (ADR-0005)."}
      - {name: removed, type: bool, doc: "The folder itself is gone: nothing was kept in it."}
methods:
  - name: list
    doc: >-
      The notes in a vault, by path. The filters combine: a note must match
      every one given.
    params:
      - {name: vaultId, type: int}
      - {name: folder, type: string, optional: true, doc: "Only notes in this folder or below it; \"/\" is the whole vault."}
      - {name: tag, type: string, optional: true, doc: "Only notes with this tag or one nested under it (tag/…), ignoring case; a leading '#' is ignored."}
      - {name: property, type: string, optional: true, doc: "Only notes whose frontmatter has this key."}
      - {name: value, type: string, optional: true, doc: "With property: only notes where the key's value, or an item of its list, equals this, ignoring case."}
    result: "[]NoteEntry"
    errors: [notFound, invalidParams]
  - name: read
    doc: A note's content and what the index found in it.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
    result: Note
    errors: [notFound]
  - name: search
    doc: >-
      Full-text search over titles, aliases, bodies and frontmatter, best
      match first. Each word matches as a prefix ("plan" finds "planting"),
      a phrase in double quotes matches as written, and every word or
      phrase must match. Case and diacritics are ignored. Filters narrow
      it, each as its own word: path:TEXT (the path contains TEXT),
      file:TEXT (the file name contains TEXT), tag:#TAG (the note has TAG
      or a tag nested under it); a filter alone lists matching notes by
      path.
    params:
      - {name: vaultId, type: int}
      - {name: query, type: string}
      - {name: limit, type: int, optional: true, doc: "At most this many; default 20, at most 100."}
    result: "[]SearchHit"
    errors: [notFound, invalidParams]
  - name: backlinks
    doc: The links to a note or attachment from the notes of its vault, by source path, then line.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
    result: "[]Backlink"
    errors: [notFound]
  - name: links
    doc: A note's links in the order they are written, each with the file it resolves to.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
    result: "[]Link"
    errors: [notFound]
  - name: create
    doc: >-
      Create a note or attachment, and any missing folders. Fails with
      conflict if the path exists.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: content, type: string}
      - {name: source, type: VersionSource, optional: true, doc: "editor (the default) or agent."}
      - {name: author, type: string, optional: true, doc: "Who is writing, for the version list; defaults to the client name given to rpc.hello."}
    result: WriteResult
    errors: [notFound, conflict, invalidParams]
  - name: write
    doc: >-
      Replace a file's content. base is the hash the writer started from.
      If the file changed since, notesd merges: frontmatter by key, then the
      body by line and word (ADR-0005). A base notesd has no version of
      (pruned after 30 days) is refused with conflict: read again, as is a
      stale base of a file that is not text, which does not merge. Bytes of
      the base that are not UTF-8, which note.read showed as U+FFFD, are
      kept wherever content leaves the words around them as they were
      (ADR-0014).
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: base, type: string, doc: "The hash of the content this write started from."}
      - {name: content, type: string}
      - {name: source, type: VersionSource, optional: true, doc: "editor (the default) or agent."}
      - {name: author, type: string, optional: true, doc: "Who is writing, for the version list; defaults to the client name given to rpc.hello."}
    result: WriteResult
    errors: [notFound, conflict, invalidParams]
  - name: move
    doc: >-
      Rename or move a note or attachment, creating missing folders. The
      file keeps its versions. With updateLinks, every link to it from
      another note is rewritten to the new path, each as a write.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: to, type: string, doc: "The new path; it must not exist."}
      - {name: updateLinks, type: bool, optional: true, doc: "Rewrite links to the file, as Obsidian's \"Automatically update internal links\" does."}
    result: MoveResult
    errors: [notFound, conflict, invalidParams]
  - name: delete
    doc: >-
      Delete a note or attachment: notesd removes the file, and its
      versions stay for 30 days, so note.revert can bring it back. base must
      be its current hash: a file changed since base is not deleted
      (conflict), because an edit beats a delete (ADR-0005).
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: base, type: string}
    errors: [notFound, conflict]
  - name: versions
    doc: >-
      A file's versions, newest first, its deletion included. For a deleted
      file, the versions of the last file at that path.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: limit, type: int, optional: true, doc: "At most this many; default 50."}
    result: "[]Version"
    errors: [notFound]
  - name: revert
    doc: >-
      Make a file's content that of one of its versions, as a write with a
      base. A deleted file comes back at its last path.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: version, type: int, doc: "The version's id, from note.versions."}
      - {name: base, type: string, doc: "The file's current hash; empty when it is deleted."}
    result: WriteResult
    errors: [notFound, conflict]
  - name: daily
    doc: >-
      A day's daily note, created from the vault's daily-note template when
      missing (docs/design/vault.md#daily-notes).
    params:
      - {name: vaultId, type: int}
      - {name: date, type: string, optional: true, doc: "YYYY-MM-DD; default today in notesd's time zone."}
      - {name: source, type: VersionSource, optional: true, doc: "Who creates it when it is missing: editor (the default) or agent."}
      - {name: author, type: string, optional: true, doc: "Who creates it, for the version list; defaults to the client name given to rpc.hello."}
    result: DailyNote
    errors: [notFound, invalidParams]
  - name: files
    doc: >-
      Every file and folder of a vault: the Files pane's listing and the
      hashes the app loads files by (ADR-0023). note.changed, note.moved and
      note.removed keep it current.
    params:
      - {name: vaultId, type: int}
    result: VaultFiles
    errors: [notFound]
  - name: resolve
    doc: >-
      Where link targets lead from a note, by the vault's link resolution
      (docs/specs/markdown.md#link-resolution), for links the editor shows
      before the index has them.
    params:
      - {name: vaultId, type: int}
      - {name: from, type: string, doc: "The linking note's path; it need not exist yet."}
      - {name: targets, type: "[]string", doc: "Link targets as written, without subpath or alias; at most 1,000."}
    result: "[]Resolution"
    errors: [notFound, invalidParams]
  - name: render
    doc: >-
      A note rendered to sanitized HTML for the reading view and embeds
      (ADR-0007): Obsidian's syntax, embeds of notes three levels deep, a
      single newline as a line break (Obsidian's default). With content,
      that text is rendered as if it were the note at path, so an editor
      shows what was typed before it is saved.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: content, type: string, optional: true}
    result: RenderedNote
    errors: [notFound, invalidParams]
  - name: upload
    doc: >-
      Create an attachment from bytes, as note.create creates a note: it
      fails with conflict if the path exists (ADR-0023). data is base64, at
      most 10 MB decoded.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: data, type: string, doc: "The file's bytes, base64 (standard alphabet, padded)."}
      - {name: source, type: VersionSource, optional: true, doc: "editor (the default) or agent."}
      - {name: author, type: string, optional: true, doc: "Who is writing; defaults to the client name given to rpc.hello."}
    result: WriteResult
    errors: [notFound, conflict, invalidParams]
  - name: readVersion
    doc: A version's content, for the history view and the merge view.
    params:
      - {name: vaultId, type: int}
      - {name: version, type: int, doc: "The version's id, from note.versions or a write's conflictVersion."}
    result: VersionContent
    errors: [notFound]
  - name: tags
    doc: Every tag in the vault's notes and how many notes have it, by tag ignoring case.
    params:
      - {name: vaultId, type: int}
    result: "[]TagCount"
    errors: [notFound]
  - name: properties
    doc: Every frontmatter key in the vault's notes, its type and how many notes have it, by key ignoring case.
    params:
      - {name: vaultId, type: int}
    result: "[]PropertyCount"
    errors: [notFound]
  - name: template
    doc: >-
      A template note's content with {{title}}, {{date}}, {{time}} and their
      formats and offsets expanded, as Obsidian's Insert template does
      (docs/design/vault.md#daily-notes).
    params:
      - {name: vaultId, type: int}
      - {name: template, type: string, doc: "The template note's path."}
      - {name: title, type: string, optional: true, doc: "{{title}}: the note it goes into; empty by default."}
      - {name: at, type: time, optional: true, doc: "The date and time {{date}} and {{time}} give; now by default."}
    result: ExpandedTemplate
    errors: [notFound, invalidParams]
  - name: mkdir
    doc: Create a folder and any missing parents. An existing folder is not an error.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
    errors: [notFound, invalidParams]
  - name: moveFolder
    doc: >-
      Rename or move a folder with everything in it, creating missing
      parents. Each file moves as note.move moves it, keeping its versions;
      with updateLinks, links to them from notes outside the folder are
      rewritten.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: to, type: string, doc: "The new path; it must not exist."}
      - {name: updateLinks, type: bool, optional: true}
    result: FolderMoveResult
    errors: [notFound, conflict, invalidParams]
  - name: deleteFolder
    doc: >-
      Delete a folder's files, each with the base the caller listed, then
      the folder when nothing is left in it. A file changed since its base,
      or not listed, is kept: an edit beats a delete (ADR-0005). Every
      deleted file's versions stay for note.revert.
    params:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: files, type: "[]FileBase", doc: "The folder's files as the caller listed them."}
    result: FolderDeleteResult
    errors: [notFound, invalidParams]
events:
  - name: changed
    doc: A file was created or its content changed, by a write or on disk.
    durable: true
    fields:
      - {name: vaultId, type: int}
      - {name: path, type: string}
      - {name: hash, type: string}
      - {name: source, type: VersionSource}
  - name: moved
    doc: A file was renamed or moved.
    durable: true
    fields:
      - {name: vaultId, type: int}
      - {name: from, type: string}
      - {name: to, type: string}
  - name: removed
    doc: A file was deleted, by note.delete or on disk.
    durable: true
    fields:
      - {name: vaultId, type: int}
      - {name: path, type: string}
