domain: rpc
protocol: 1
callers: [local, session, device, agent]
doc: >-
  Connection setup. A client calls rpc.hello first on every connection; the
  server answers any other method with notReady until hello succeeds.
types:
  - name: Hello
    doc: Server identity, the negotiated protocol, and who the connection is.
    fields:
      - {name: protocol, type: int, doc: "Protocol major version the server speaks."}
      - {name: server, type: string, doc: "Server name and version, for logs."}
      - {name: caller, type: string, doc: "The connection's caller kind: local, session, device or agent (docs/specs/rpc-protocol.md#caller-kinds)."}
      - {name: login, type: string, optional: true, doc: "A session's tailnet login, from lodge."}
      - {name: displayName, type: string, optional: true, doc: "A session's display name, when lodge sends one."}
      - {name: node, type: string, optional: true, doc: "A session's node: its short host name, from lodge."}
      - {name: contentKey, type: string, optional: true, doc: "A session's key for content URLs, 32 bytes in unpadded base64url: a file's URL on lodge-content names it by an HMAC under this key (docs/specs/lodge-app.md#contentblobs)."}
      - {name: build, type: string, optional: true, doc: "The Flatpak build this notesd runs from: the app-commit of its instance, which differs for every build, even of one version. Absent outside the Flatpak (ADR-0032)."}
methods:
  - name: hello
    doc: Negotiate the protocol major version. Changes within a major version are additive only.
    params:
      - {name: protocol, type: int, doc: "Protocol major version the client speaks."}
      - {name: client, type: string, doc: "Client name and version, for logs."}
    result: Hello
    errors: [protocolMismatch]
  - name: ping
    doc: >-
      Nothing, answered: the web app's heartbeat while it is visible, which
      finds a connection a sleeping phone dropped.
  - name: shutdown
    callers: [local]
    doc: >-
      Stop notesd as SIGTERM does: it answers, cancels the requests in hand and
      waits for them to return, stops the vaults and sync, closes the store,
      releases the data directory's lock and exits 0. The Flatpak's launcher calls it to replace an older
      build (ADR-0032).
