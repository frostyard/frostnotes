# The store stays inside the nsl machine (dev/nsl/provision.sh); without this
# pnpm puts it beside the project, in the host's home directory.
storeDir: /var/tmp/frostnotes/pnpm-store
packageImportMethod: copy
# Two of lang-markdown's transitive Lezer parsers, held to the newest
# releases at least two weeks old when CodeMirror was added (2026-10-16).
overrides:
  "@lezer/css": 1.3.8
  "@lezer/lr": 1.4.10
# CodeMirror's height map walked the whole of itself, a node per line the
# view ever measured, on every measure; the patch walks only what is
# outdated (docs/adr/0024-patch-what-costs-the-editor-its-frames.md). Drop it
# once @codemirror/view walks only what changed.
patchedDependencies:
  "@codemirror/view@6.43.13": patches/@codemirror__view@6.43.13.patch
