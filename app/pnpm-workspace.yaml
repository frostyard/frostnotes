# The store stays inside the nsl machine (dev/nsl/provision.sh); without this
# pnpm puts it beside the project, in the host's home directory.
storeDir: /var/tmp/frostnotes/pnpm-store
packageImportMethod: copy
# Two of lang-markdown's transitive Lezer parsers, held to the newest
# releases at least two weeks old when CodeMirror was added (2026-10-16).
overrides:
  "@lezer/css": 1.3.8
  "@lezer/lr": 1.4.10
