# notesd's system user (docs/specs/lodge-app.md): its own, in lodge's
# group lodge-apps for inference, never in group lodge.
#
# Group lodge owns the app socket (SocketGroup=lodge). This file declares
# the group too, so that the socket starts without lodge's own sysext
# (frostyard/core ADR-0058). The user is never a member of group lodge.
g lodge -
u frostnotes - "Frostnotes notes daemon" /var/lib/frostnotes
m frostnotes lodge-apps

# User lodge, exactly as lodge's own sysusers.d/lodge.conf declares it, so
# that the app daemon (lodgeapp.LoadEnv) resolves it without lodge's
# sysext (snosi T401a). The lines must stay identical, or sysusers warns
# and keeps only the first.
u lodge - "lodge, the tailnet web shell for frostyard's apps" /var/lib/lodge
