version: "2"

# Code style configuration for golangci-lint (v2 schema). `make lint` and the
# CI Lint job (jdx/mise-action) both run `golangci-lint run`, which reads
# this file. The linter release itself is pinned in mise.toml, with its
# checksums in mise.lock — the CI job installs exactly that version and
# `make lint` warns when the local binary differs — so local and CI results
# should not drift silently.
# Pins the defaults the repo has been linted with; a finding here means the
# gate is red — fix the finding, never loosen the config.

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
