# PR triage caller (ADR-0068, ADR-0077, ADR-0078, docs/specs/pr-triage.md):
# this caller runs core's reusable PR triage workflow on every pull request,
# from pull_request_target, so the base risk list and trusted caller execute.
# It adds the level labels level:L1 to level:L4, adds risk:high at L1 and L2,
# and removes ready-for-human when the head moved after the label or CI was
# not green at the label.
#
# It checks out nothing and runs no code from the PR branch. It is not a
# required check, and it has no merge_group trigger. The job id must stay
# pr-triage: the readiness step leaves out check runs whose name starts with
# pr-triage. The repository must have the risk:high label, or this job fails.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # core#246 (frostyard/core main, 2026-11-14)
