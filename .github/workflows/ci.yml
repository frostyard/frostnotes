# CI: the jobs of `make ci`, which runs the same gates on a developer's
# machine. Actions are pinned to full commit SHAs and jobs get only the
# permissions they need (frostyard/core ADR-0021, checked by
# internal/workflowcheck); tools come from go.mod and mise.lock (ADR-0043).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 5 * * *" # nightly, so upstream drift surfaces within a day
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (make verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # proxy.golang.org can fail a download now and then (#243): fetch
      # every module of the build list, with up to 3 tries, so that the
      # gate below reads them from the module cache. go mod download adds
      # the sums of all it fetches to the go.sum beside its go.mod, which
      # go mod tidy -diff refuses, so it works on a copy of the two.
      - name: Download the Go modules
        run: |
          cp go.mod "$RUNNER_TEMP/download.mod"
          cp go.sum "$RUNNER_TEMP/download.sum"
          for i in 1 2 3; do
            go mod download -modfile="$RUNNER_TEMP/download.mod" all && exit 0
            sleep 10
          done
          exit 1
      # The locked golangci-lint, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: golangci-lint
          cache: true
      - name: Tidy, vet, format, lint and unit tests
        run: make verify

  # The race gate, make race, in its 3 parts on 3 runners (ADR-0048): the
  # job waits for its slowest part, not for their sum. The shards are the
  # Makefile's race-<shard> targets, and internal/workflowcheck fails when
  # the two lists differ. The required check is the race job below.
  race-shards:
    name: Race shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # A failed shard does not stop the others: one run shows every failure.
      fail-fast: false
      matrix:
        shard: [rest, sim, sim-checkptr]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # proxy.golang.org can fail a download now and then (#243): fetch
      # every module of the build list, with up to 3 tries, so that the
      # gate below reads them from the module cache. go mod download adds
      # the sums of all it fetches to the go.sum beside its go.mod, which
      # go mod tidy -diff refuses, so it works on a copy of the two.
      - name: Download the Go modules
        run: |
          cp go.mod "$RUNNER_TEMP/download.mod"
          cp go.sum "$RUNNER_TEMP/download.sum"
          for i in 1 2 3; do
            go mod download -modfile="$RUNNER_TEMP/download.mod" all && exit 0
            sleep 10
          done
          exit 1
      # Each target sets go test's timeout to 25 minutes: internal/synctest
      # took 10 to 14 minutes under the race detector with checkptr in every
      # package, which go test's default 10 minutes is too tight for.
      - name: Run the shard's part of the race gate
        run: make "race-$SHARD"

  # The required check: the rulesets match the name "Race detector". It
  # passes only when every shard passed. It runs always, since a job that is
  # skipped because a shard failed or was cancelled would count as passed.
  race:
    name: Race detector
    needs: race-shards
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.race-shards.result }}
        run: |
          echo "the race shards: $SHARDS"
          test "$SHARDS" = success

  vulncheck:
    name: Vulnerabilities (make vulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The version is pinned in the Makefile; the Go checksum database verifies the module.
      - name: govulncheck
        run: make vulncheck

  # The app's jobs (M0 Phase 4). The app targets normally run in the nsl
  # machine; here IN_NSL runs them on the runner. The toolchain versions are
  # the ones dev/nsl/provision.sh pins.
  ui:
    name: App UI (make ui-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by app/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make ui-check IN_NSL='sh -c'

  # The release's .deb as a snapshot (make deb; its deb-check runs inside).
  deb:
    name: Snapshot .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Web build
        run: make web-build IN_NSL='sh -c'
      - name: Build and check the snapshot .deb
        run: make deb
