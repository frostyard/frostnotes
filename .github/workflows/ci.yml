# CI: the jobs of `make ci`, which runs the same gates on a developer's
# machine. Actions are pinned to full commit SHAs and jobs get only the
# permissions they need (frostyard/core ADR-0021, checked by
# internal/workflowcheck); tools come from go.mod and mise.lock (ADR-0043).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 5 * * *" # nightly, so upstream drift surfaces within a day
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (make verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # proxy.golang.org can fail a download now and then (#243): fetch
      # every module of the build list, with up to 3 tries, so that the
      # gate below reads them from the module cache. go mod download adds
      # the sums of all it fetches to the go.sum beside its go.mod, which
      # go mod tidy -diff refuses, so it works on a copy of the two.
      - name: Download the Go modules
        run: |
          cp go.mod "$RUNNER_TEMP/download.mod"
          cp go.sum "$RUNNER_TEMP/download.sum"
          for i in 1 2 3; do
            go mod download -modfile="$RUNNER_TEMP/download.mod" all && exit 0
            sleep 10
          done
          exit 1
      # The locked golangci-lint, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: golangci-lint
          cache: true
      # The desktop app's tests render views headless with MyGo's Tester,
      # which lays text out with Pango and cairo (no GTK, no display).
      - name: Install the text runtime of the desktop app's tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core libpangocairo-1.0-0
      - name: Tidy, vet, format, lint and unit tests
        run: make verify
      # make verify ran the NSGo client's suite headless (nsgo-check). Next,
      # the same suite in a real GTK 4 window, under Xvfb (docs/design/app.md,
      # The NSGo client's live suite). The packages are the ones frostmail's
      # NSGo client job installs for its live suite.
      - name: Install the window runtime of the live suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-4-1 libwebkitgtk-6.0-4 libxtst6 libxi6 fonts-dejavu-core xvfb xauth
      - run: make nsgo-live
      # The pictures this run drew, to read beside the kept ones
      # (cmd/frostnotes-nsgo/comparison/linux). No step compares them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nsgo-live-pictures
          path: cmd/frostnotes-nsgo/.nsgo/test/screenshots/linux
          if-no-files-found: warn

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # proxy.golang.org can fail a download now and then (#243): fetch
      # every module of the build list, with up to 3 tries, so that the
      # gate below reads them from the module cache. go mod download adds
      # the sums of all it fetches to the go.sum beside its go.mod, which
      # go mod tidy -diff refuses, so it works on a copy of the two.
      - name: Download the Go modules
        run: |
          cp go.mod "$RUNNER_TEMP/download.mod"
          cp go.sum "$RUNNER_TEMP/download.sum"
          for i in 1 2 3; do
            go mod download -modfile="$RUNNER_TEMP/download.mod" all && exit 0
            sleep 10
          done
          exit 1
      # The desktop app's tests render views headless with MyGo's Tester,
      # which lays text out with Pango and cairo (no GTK, no display).
      - name: Install the text runtime of the desktop app's tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core libpangocairo-1.0-0
      # internal/synctest alone takes about 9.5 minutes under the race
      # detector here, so go test's default 10-minute timeout is too tight.
      - run: go test -race -timeout 25m ./...

  vulncheck:
    name: Vulnerabilities (make vulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The version is pinned in the Makefile; the Go checksum database verifies the module.
      - name: govulncheck
        run: make vulncheck

  # The app's jobs (M0 Phase 4). The app targets normally run in the nsl
  # machine; here IN_NSL runs them on the runner. The toolchain versions are
  # the ones dev/nsl/provision.sh pins.
  ui:
    name: App UI (make ui-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by app/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make ui-check IN_NSL='sh -c'

  # The release's .deb as a snapshot (make deb; its deb-check runs inside).
  deb:
    name: Snapshot .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Web build
        run: make web-build IN_NSL='sh -c'
      - name: Build and check the snapshot .deb
        run: make deb

  desktop:
    name: Native desktop app (make desktop-smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install GTK, a software renderer and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb xauth dbus libgtk-4-1 libgtk-3-0t64 libgl1 libegl1 libgl1-mesa-dri libpangocairo-1.0-0 fonts-dejavu-core
      - name: Build the release app and start it against a real notesd
        run: make desktop-smoke
      # The typing gate on CI: a keystroke over 25 ms fails, not 16 ms as on a
      # developer machine, since the runner's CPU varies (ADR-0043).
      - name: Time a keystroke in a long note
        run: make desktop-bench
