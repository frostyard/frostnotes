# Dependabot (frostyard/core ADR-0071, ADR-0075 and ADR-0089, baseline row
# B13): exactly 1 entry for each ecosystem with a manifest here. If an
# ecosystem has more than 1 directory, list them in directories. Each
# entry has a monthly schedule and 1 catch-all group. Each ecosystem then
# opens at most 1 version-update PR a month. Security updates stay
# ungrouped and immediate (no applies-to). internal/workflowcheck checks it.
#
# A gomod update also changes the Flatpak's offline sources: its PR fails the
# Flatpak workflow's sources check until `make flatpak-sources` is run on its
# branch. The repository-hygiene line does that.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # `@types/node` follows the Node major the app runs on (`NODE_VERSION` in ci.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      app-npm:
        patterns: ["*"]
